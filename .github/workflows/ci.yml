name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend dependency contracts
        run: npm run test:dependencies

      - name: Build frontend
        run: npm run build

  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Playwright의 webServer가 Go API를 in-memory 모드로 직접 띄운다.
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod

      - name: Install dependencies
        run: npm ci

      # 브라우저 바이너리는 캐시하지 않는다. 패키지 버전과 짝을 이루므로 캐시 키를
      # 어긋나게 잡으면 조용히 낡은 바이너리로 돌게 된다. 설치는 1분 이내다.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  backend:
    name: backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Check go mod tidy drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  backend-postgres:
    name: backend postgres test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kagoshima_travel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kagoshima_travel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Apply PostgreSQL schema
        run: |
          docker cp schema.sql "${{ job.services.postgres.id }}:/tmp/schema.sql"
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d kagoshima_travel -f /tmp/schema.sql

      - name: Run Go tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kagoshima_travel?sslmode=disable
          JWT_SECRET: test-secret
        run: go test ./... -count=1

  pr-check-doctor:
    name: pr check doctor
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - backend-postgres
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # pr-check-doctor v0.1.2 pinned to an immutable commit for CodeQL.
      - uses: hjh6709/pr-check-doctor@7c8470ffe18d6fc9d1f432bdfe45579e6c662757
        with:
          github-token: ${{ github.token }}
